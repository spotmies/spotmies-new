<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Invert Effect</title>
    <style>
        /* Product Sans Font Import */
        @import url('https://fonts.cdnfonts.com/css/product-sans');

        /* Basic Reset */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents scrollbars */
            background-color: #000; /* Fallback for video */
        }

        /* Main container for the video and text */
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: grid; /* Use grid to easily center the content */
            place-items: center;
        }

        /* Background Video Styling */
        #background-video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures video covers the container without distortion */
            transform: translate(-50%, -50%);
            z-index: 1; /* Puts video in the background */
        }

        /* --- Subtle white overlay --- */
        .white-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;   /* The color of the overlay */
            mix-blend-mode: overlay;   /* This blends the white with the video colors */
            opacity: 0.15;             /* Controls the strength of the effect */
            z-index: 2;                /* Sits between the video and the text */
        }

        /* --- NEW: Wrapper for text and button --- */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem; /* Space between the text and the button */
            /* REMOVED position and z-index from here to fix blending */
        }

        /* Text Styling */
        .cinematic-text {
            /* --- ADDED positioning here --- */
            position: relative;
            z-index: 3;

            /* --- The Main Effect --- */
            color: white;
            mix-blend-mode: difference;
            
            font-family: 'Product Sans', 'Helvetica Neue', sans-serif;
            font-weight: 700;
            font-style: normal;
            font-size: 150px;
            text-align: center;
            text-transform: uppercase;
            line-height: 1;
            padding: 0 2rem;
        }

        /* --- NEW: Button Styling --- */
        .cta-button {
            /* Positioning and Font */
            position: relative; /* Needed for the pseudo-element */
            z-index: 3; /* Changed from 1 to 3 to ensure it's on top */
            font-family: 'Product Sans', 'Helvetica Neue', sans-serif;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            
            /* Appearance */
            background-color: black;
            color: white;
            border: 1px solid black;
            border-radius: 50px; /* Fully rounded corners */
            padding: 1rem 2.5rem;
            cursor: pointer;
            overflow: hidden; /* Crucial for the hover effect */

            /* Transitions */
            transition: color 0.4s ease-in-out;
        }

        /* The pseudo-element for the hover animation */
        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            border-radius: 50px;
            transform: translateX(-101%); /* Start hidden to the left */
            transition: transform 0.4s ease-in-out;
            z-index: -1; /* Place it behind the button's text */
        }
        
        /* Hover state for the button */
        .cta-button:hover {
            color: black; /* Change text color to black */
        }

        .cta-button:hover::before {
            transform: translateX(0); /* Slide the white fill in */
        }


        /* Responsive font size for smaller screens */
        @media (max-width: 768px) {
            .cinematic-text {
                font-size: 20vw;
            }
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- The background video -->
        <video id="background-video" autoplay loop muted playsinline poster="https://placehold.co/1920x1080/000000/FFFFFF?text=Loading...">
            <source src="Discover_Desktop_L_HiRes_2X.av1.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <!-- The new overlay element -->
        <div class="white-overlay"></div>

        <!-- Wrapper for text and button -->
        <div class="content-wrapper">
            <!-- The inverted text -->
            <h1 class="cinematic-text">
                Cinematic
            </h1>

            <!-- The new button -->
            <button class="cta-button">
                Click Me
            </button>
        </div>
    </div>

</body>
</html>
